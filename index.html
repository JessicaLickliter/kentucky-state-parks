<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>My Mapbox Map</title>

  <!-- Mapbox GL JS -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.js"></script>
  <link
    href="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.css"
    rel="stylesheet"
  />

  <style>
    body {
      margin: 0;
      padding: 0;
    }

    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    // Your access token
    mapboxgl.accessToken = 'pk.eyJ1IjoiamVzc2ljYWxpY2tsaXRlciIsImEiOiJjbW9jN3NrazUwOWViMnNxMXRrcHZtaW9qIn0.hfi6DW739PZbY6LdpMKkJg';

    // Create the map
    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/jessicalickliter/cmohutnhb003501s67qd21diz',
      center: [-84.967448, 37.665919], // longitude, latitude
      zoom: 6.3
    });

    // Optional navigation controls
    map.addControl(new mapboxgl.NavigationControl());
  </script>
</body>
</html>
<div id="legend">
  <div class="legend-item">
    <span class="legend-icon">🌲</span>
    <span>State Park</span>
  </div>
</div>
